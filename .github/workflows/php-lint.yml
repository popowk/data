name: PHP syntax and MySQL 5.7 smoke checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Syntax check all PHP files
        run: find . -type f -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: node --check assets/app.js
      - name: Test encrypted backup roundtrip and offline restore
        run: php tests/backup-crypto-smoke.php
      - name: Verify pinned server update signatures and tamper rejection
        run: php tests/update-signature-smoke.php
      - name: Simulate complete update, forced failure and rollback
        run: php tests/updater-install-smoke.php
      - name: Validate version manifest
        run: php -r '$d=json_decode(file_get_contents("version.json"),true,512,JSON_THROW_ON_ERROR); if (!preg_match("/^\d+\.\d+\.\d+$/", $d["version"])) exit(1);'
      - name: Ed25519 release-signing and ZIP smoke test
        run: php tests/release-smoke.php
      - name: Verify updater's strict mirror download
        run: |
          php -r 'require "app/core.php"; require "app/updater.php"; $f=tempnam("storage","ci-"); try {update_download($f); $z=new ZipArchive; if ($z->open($f)!==true) exit(1); echo "PHP updater download: ".$z->numFiles." files\n";$z->close();} finally {@unlink($f);}'
      - name: Validate self-update archive contents
        run: php tests/updater-smoke.php
      - name: Probe China mirror ZIP endpoint (informational)
        continue-on-error: true
        run: |
          curl -fLsS --max-time 35 'https://git.wksite.cn/popowk/data/archive/refs/heads/main.zip' -o /tmp/phonehub-proxy.zip
          php -r '$z=new ZipArchive; if ($z->open("/tmp/phonehub-proxy.zip")!==true) exit(1); echo "Mirror archive: ".$z->numFiles." entries\n"; $z->close();'

  mysql57-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: phonehub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm PHP MySQL driver
        run: php -r 'if (!extension_loaded("pdo_mysql")) {fwrite(STDERR,"pdo_mysql missing\n");exit(1);}'
      - name: Schema and account smoke test
        run: php tests/smoke.php
      - name: HTTP API end-to-end smoke test
        run: bash tests/api-smoke.sh

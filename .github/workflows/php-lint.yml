name: PHP syntax checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: Syntax check all PHP files
        run: find . -type f -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n1 php -l
      - name: Validate version manifest
        run: php -r '$d=json_decode(file_get_contents("version.json"),true,512,JSON_THROW_ON_ERROR); if (!preg_match("/^\d+\.\d+\.\d+$/", $d["version"])) exit(1);'

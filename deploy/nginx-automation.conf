# Copy into the EXISTING BaoTa Nginx server { ... } for /license/.
# This snippet is ONLY URL routing; retain existing PHP FastCGI rules,
# Authorization header forwarding, HTTPS enforcement and storage/ deny.
location ~ ^/license/automation/v1/(releases(?:/prepare|/[1-9][0-9]*(?:/(?:publish|disable))?)?)/?$ {
    rewrite ^/license/automation/v1/(.*)$ /license/automation/v1/index.php?route=$1 last;
}
